name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.0 (the tag v<version> is created on the selected branch)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$version' (expected e.g. 1.2.0 or 1.2.0-beta.1)"
            exit 1
          fi
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          VDISPLAY_VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --release --locked

      - name: Check embedded version
        shell: bash
        run: |
          out="$(./target/release/vdisplay.exe --version)"
          echo "$out"
          [ "$out" = "vdisplay ${{ steps.version.outputs.version }}" ]

      - name: Package
        id: package
        shell: pwsh
        run: |
          $name = "vdisplay-${{ steps.version.outputs.tag }}-windows-x64"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item target/release/vdisplay.exe, README.md, README.zh-CN.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii -NoNewline "dist/$name.zip.sha256"
          "zip=dist/$name.zip" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease || contains(steps.version.outputs.version, '-') }}
        run: |
          args=(--title "$TAG" --generate-notes --verify-tag)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            args=(--title "$TAG" --generate-notes --target "$GITHUB_SHA")
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" \
            "${{ steps.package.outputs.zip }}" \
            "${{ steps.package.outputs.zip }}.sha256"
